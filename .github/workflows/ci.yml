name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: import graph
        run: go run ./cmd/importcheck
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...
      - name: gate-m0
        run: go run ./cmd/raftlab gate-m0 -seeds 3 -until 200
